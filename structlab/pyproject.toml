[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structlab"
version = "0.1.0"
description = "Structural analysis & design learning tool (trusses, beams, frames, machines)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["structlab*"]

[tool.setuptools.package-data]
"structlab.materials" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
